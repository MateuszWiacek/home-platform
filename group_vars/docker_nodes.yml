---
# === Identity ===
ansible_user: admin
ansible_ssh_private_key_file: ~/.ssh/id_ed25519

# === Docker host ===
portainer_agent_version: "2.33.7"

# === NFS Source Paths (what TrueNAS exports) ===
nas_source_config: "/mnt/example_apps/appdata/docker/config"
nas_source_data: "/mnt/example_apps/appdata/docker/data"
nas_source_backup: "/mnt/example_apps/backup"
nas_source_photos: "/mnt/example_storage/photos/library"
nas_source_docs: "/mnt/example_storage/documents"
nas_source_media: "/mnt/example_storage/media"
nas_media_child_mounts:
  - { src: "/mnt/example_storage/media/audiobooks", path: "{{ mnt_media }}/audiobooks" }
  - { src: "/mnt/example_storage/media/ebooks", path: "{{ mnt_media }}/ebooks" }
  - { src: "/mnt/example_storage/media/music", path: "{{ mnt_media }}/music" }
  - { src: "/mnt/example_storage/media/movies", path: "{{ mnt_media }}/movies" }
  - { src: "/mnt/example_storage/media/series", path: "{{ mnt_media }}/series" }
  - { src: "/mnt/example_storage/media/sync", path: "{{ mnt_media }}/sync" }

# === Mount Points (Logical Paths on Ryzen VM) ===
mnt_fast_config: "/mnt/nas_fast_config"
mnt_fast_data: "/mnt/nas_fast_data"
mnt_backup: "/mnt/nas_backup"
mnt_photos: "/mnt/nas_photos"
mnt_docs: "/mnt/nas_documents"
mnt_media: "/mnt/nas_media"

# === Production app versions ===
# Prefer exact upstream tags where they exist.
# Immich server and machine-learning are kept on the same exact upstream tag
# to avoid silent drift between the two images.
immich_version: "v3.1.0"
paperless_version: "3.1.3"
stirling_pdf_version: "2.14.3"
it_tools_version: "2024.10.22-7ca5933"
navidrome_version: "0.63.2"
audiobookshelf_version: "2.36.0"
calibre_web_version: "0.6.26-ls373"
siyuan_version: "v3.8.3"
excalidraw_image: "excalidraw/excalidraw@sha256:20ffa04668e19616bb0c1b3632849e5cd96e0bc7a1336b73d9d072667f2c2854"
mealie_version: "v3.25.1"
syncthing_version: "v2.0.15-ls211"
linkwarden_version: "v2.16.2"
linkwarden_postgres_image: "docker.io/library/postgres:16-alpine"
monitoring_exporters_host_label: "ryzen"
node_exporter_version: "v1.12.1"
cadvisor_version: "v0.60.5"
prometheus_version: "v3.14.0"
grafana_version: "13.2.1"
alertmanager_version: "v0.34.0"
loki_version: "3.7.7"
dozzle_version: "v10.10.0"
promtail_version: "3.7.7"
# Internal dependencies (override only if required)
# WARNING: pgvecto-rs is deprecated for Immich v2.x+.
# After migrating data, update to: ghcr.io/immich-app/postgres:14-vectorchord0.4.3
# Migration steps: see docs/setup/COMMON_ISSUES.md -> "Immich: pgvecto-rs -> VectorChord migration"
immich_postgres_image: "tensorchord/pgvecto-rs:pg14-v0.2.0"
immich_redis_image: "redis:6.2-alpine"
paperless_postgres_image: "docker.io/library/postgres:16-alpine"
paperless_redis_image: "docker.io/library/redis:7-alpine"

# === Archwright (Ryzen-side Docker PostgreSQL backups) ===
archwright_config_dir: "/opt/backups/archwright"
archwright_backup_dir: "{{ mnt_backup }}/archwright"
archwright_keep_last: 28
archwright_run_user: "backup"
archwright_run_group: "backup"
archwright_jobs:
  - name: "immich-db"
    description: "Immich PostgreSQL backup"
    enabled: true
    config_template: "archwright/immich-db.yml.j2"
    config_path: "{{ archwright_config_dir }}/immich-db.yml"
    backup_path: "{{ archwright_backup_dir }}/immich-db"
    on_calendar: "*-*-* 03:00:00"
  - name: "paperless-db"
    description: "Paperless PostgreSQL and app-state backup"
    enabled: true
    config_template: "archwright/paperless-db.yml.j2"
    config_path: "{{ archwright_config_dir }}/paperless-db.yml"
    backup_path: "{{ archwright_backup_dir }}/paperless-db"
    on_calendar: "*-*-* 03:10:00"
  - name: "linkwarden-db"
    description: "Linkwarden PostgreSQL and archive-data backup"
    enabled: true
    config_template: "archwright/linkwarden-db.yml.j2"
    config_path: "{{ archwright_config_dir }}/linkwarden-db.yml"
    backup_path: "{{ archwright_backup_dir }}/linkwarden-db"
    on_calendar: "*-*-* 03:20:00"
  - name: "mealie-state"
    description: "Mealie SQLite/app-data backup"
    enabled: true
    config_template: "archwright/mealie-state.yml.j2"
    config_path: "{{ archwright_config_dir }}/mealie-state.yml"
    backup_path: "{{ archwright_backup_dir }}/mealie-state"
    on_calendar: "*-*-* 03:30:00"
  - name: "siyuan-state"
    description: "SiYuan workspace backup"
    enabled: true
    config_template: "archwright/siyuan-state.yml.j2"
    config_path: "{{ archwright_config_dir }}/siyuan-state.yml"
    backup_path: "{{ archwright_backup_dir }}/siyuan-state"
    on_calendar: "*-*-* 03:40:00"
  - name: "navidrome-state"
    description: "Navidrome database/config backup"
    enabled: true
    config_template: "archwright/navidrome-state.yml.j2"
    config_path: "{{ archwright_config_dir }}/navidrome-state.yml"
    backup_path: "{{ archwright_backup_dir }}/navidrome-state"
    on_calendar: "*-*-* 03:50:00"
  - name: "audiobookshelf-state"
    description: "Audiobookshelf config/metadata backup"
    enabled: true
    config_template: "archwright/audiobookshelf-state.yml.j2"
    config_path: "{{ archwright_config_dir }}/audiobookshelf-state.yml"
    backup_path: "{{ archwright_backup_dir }}/audiobookshelf-state"
    on_calendar: "*-*-* 04:00:00"
  - name: "calibre-web-state"
    description: "Calibre-Web config backup"
    enabled: true
    config_template: "archwright/calibre-web-state.yml.j2"
    config_path: "{{ archwright_config_dir }}/calibre-web-state.yml"
    backup_path: "{{ archwright_backup_dir }}/calibre-web-state"
    on_calendar: "*-*-* 04:10:00"
  - name: "syncthing-state"
    description: "Syncthing config and identity backup"
    enabled: true
    config_template: "archwright/syncthing-state.yml.j2"
    config_path: "{{ archwright_config_dir }}/syncthing-state.yml"
    backup_path: "{{ archwright_backup_dir }}/syncthing-state"
    on_calendar: "*-*-* 04:20:00"
