---
- name: "Monitoring Exporters | Pre-flight validation"
  ansible.builtin.import_tasks: validate.yml
  tags: [validate]

- name: "Monitoring Exporters | Ensure stack directory exists"
  ansible.builtin.file:
    path: "{{ exporters_stack_dir }}"
    state: directory
    mode: '0755'

- name: "Monitoring Exporters | Ensure node-exporter textfile directory exists"
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    mode: '0755'

- name: "Monitoring Exporters | Deploy homelab health metrics collector"
  ansible.builtin.template:
    src: "homelab-health-metrics.py.j2"
    dest: "{{ homelab_health_metrics_script }}"
    owner: root
    group: root
    mode: '0755'

- name: "Monitoring Exporters | Deploy homelab health metrics service"
  ansible.builtin.template:
    src: "homelab-health-metrics.service.j2"
    dest: "/etc/systemd/system/homelab-health-metrics.service"
    owner: root
    group: root
    mode: '0644'
  register: _homelab_health_metrics_service

- name: "Monitoring Exporters | Deploy homelab health metrics timer"
  ansible.builtin.template:
    src: "homelab-health-metrics.timer.j2"
    dest: "/etc/systemd/system/homelab-health-metrics.timer"
    owner: root
    group: root
    mode: '0644'
  register: _homelab_health_metrics_timer

- name: "Monitoring Exporters | Enable homelab health metrics timer"
  ansible.builtin.systemd:
    name: homelab-health-metrics.timer
    enabled: true
    state: started
    daemon_reload: "{{ _homelab_health_metrics_service.changed or _homelab_health_metrics_timer.changed }}"

- name: "Monitoring Exporters | Run homelab health metrics once"
  ansible.builtin.command:
    cmd: "{{ homelab_health_metrics_script }}"
  changed_when: false

- name: "Monitoring Exporters | Deploy docker-compose file"
  ansible.builtin.template:
    src: "docker-compose.yml.j2"
    dest: "{{ exporters_stack_dir }}/docker-compose.yml"
    mode: '0644'
  notify: Restart monitoring exporters

- name: "Monitoring Exporters | Ensure Promtail config directory exists"
  ansible.builtin.file:
    path: "{{ exporters_stack_dir }}/promtail"
    state: directory
    mode: '0755'

- name: "Monitoring Exporters | Deploy Promtail config"
  ansible.builtin.template:
    src: "promtail/promtail.yml.j2"
    dest: "{{ exporters_stack_dir }}/promtail/promtail.yml"
    mode: '0644'
  notify: Restart monitoring exporters

- name: "Monitoring Exporters | Deploy Authentik Postgres exporter queries"
  ansible.builtin.template:
    src: "authentik-queries.yml.j2"
    dest: "{{ exporters_stack_dir }}/authentik-queries.yml"
    mode: '0644'
  when: authentik_postgres_exporter_enabled | default(false) | bool
  notify: Restart monitoring exporters

- name: "Monitoring Exporters | Deploy Authentik Postgres exporter env"
  ansible.builtin.template:
    src: "authentik-postgres-exporter.env.j2"
    dest: "{{ exporters_stack_dir }}/authentik-postgres-exporter.env"
    mode: '0600'
  when: authentik_postgres_exporter_enabled | default(false) | bool
  notify: Restart monitoring exporters

- name: "Monitoring Exporters | Remove Authentik Postgres exporter env when disabled"
  ansible.builtin.file:
    path: "{{ exporters_stack_dir }}/authentik-postgres-exporter.env"
    state: absent
  when: not (authentik_postgres_exporter_enabled | default(false) | bool)
  notify: Restart monitoring exporters

- name: "Monitoring Exporters | Start containers"
  ansible.builtin.shell:
    cmd: "docker compose up -d --remove-orphans"
    chdir: "{{ exporters_stack_dir }}"
  changed_when: false
  when: not ansible_check_mode
